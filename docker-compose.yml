# Herd already uses 5432/6379, so host ports are shifted.

x-laravel-worker: &laravel-worker
  build: ./alert-api/docker/worker
  volumes:
    - ./alert-api:/app
  # Real env vars win over alert-api/.env, so the same code reaches services by their Docker names.
  environment:
    KAFKA_BROKERS: redpanda:9092
    DB_HOST: postgres
    DB_PORT: 5432
    REDIS_HOST: redis
    REDIS_PORT: 6379
  depends_on:
    redpanda:
      condition: service_healthy
    postgres:
      condition: service_started
    redis:
      condition: service_started
  restart: unless-stopped

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      retries: 10

  console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis:/data

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: alerts
      POSTGRES_PASSWORD: alerts
      POSTGRES_DB: alerts
    ports:
      - "5433:5432"
    volumes:
      - postgres:/var/lib/postgresql/data

  # alert-api's long-running workers: same image, same mounted code, one process each.
  # Docker is their supervisor: started by `docker compose up`, restarted when they crash.
  alert-consumer:
    <<: *laravel-worker
    command: php artisan alerts:consume-triggered # Kafka alert-triggered -> Postgres

  alert-relay:
    <<: *laravel-worker
    command: php artisan alerts:relay # Postgres outbox -> Redis. Exactly one replica: never scale it.

volumes:
  redpanda:
  redis:
  postgres:
